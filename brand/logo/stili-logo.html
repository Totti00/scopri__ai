<!doctype html><html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
body{margin:0;width:1600px;height:1720px;background:#fff;font-family:'Space Grotesk',sans-serif}
.r{display:flex;align-items:center;gap:20px;padding:12px 30px}
.lab{width:150px;font-size:26px;font-weight:700;color:#121212}
.p{width:690px;height:200px;display:flex;align-items:center;justify-content:center;gap:22px}
.b{background:#2340FF;color:#FFFFFF}.c{background:#F4F1EA;color:#121212;border:1px solid #ddd}
.w{font-size:96px;font-weight:700;letter-spacing:-3px;line-height:1}
.b .k{color:#FFD84D}.c .k{color:#2340FF}
.hl{background:#FFD84D;color:#121212;padding:0 12px}
.low{font-size:100px;font-weight:700;letter-spacing:-4px}
.dot{display:inline-block;width:26px;height:26px;border-radius:50%;background:#FFD84D;margin:0 4px 6px}
.c .dot{background:#2340FF}
.stack{display:flex;flex-direction:column;align-items:center;line-height:1}
.stack .s1{font-size:34px;letter-spacing:14px;font-weight:700}
.stack .s2{font-size:120px;font-weight:700;letter-spacing:-4px;border-bottom:16px solid #FFD84D;padding:0 10px}
.c .stack .s2{border-color:#2340FF}
.mono{font-family:'JetBrains Mono',monospace;font-size:78px;font-weight:700}
.cur{display:inline-block;width:40px;height:78px;background:#FFD84D;vertical-align:-10px;margin-left:6px}
.c .cur{background:#2340FF}
.lens{display:inline-block;vertical-align:middle}
</style></head><body>
<div class="r"><div class="lab">1 · Lente</div>
 <div class="p b"><svg width="120" height="120" viewBox="0 0 1080 1080"><line x1="650" y1="650" x2="805" y2="805" stroke="#FFD84D" stroke-width="96" stroke-linecap="round"/><circle cx="480" cy="480" r="235" fill="none" stroke="#fff" stroke-width="64"/><text x="480" y="480" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="220" fill="#fff">AI</text></svg><div class="w">Scopri<span class="k">.AI</span></div></div>
 <div class="p c"><svg width="120" height="120" viewBox="0 0 1080 1080"><line x1="650" y1="650" x2="805" y2="805" stroke="#2340FF" stroke-width="96" stroke-linecap="round"/><circle cx="480" cy="480" r="235" fill="none" stroke="#121212" stroke-width="64"/><text x="480" y="480" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="220" fill="#121212">AI</text></svg><div class="w">Scopri<span class="k">.AI</span></div></div></div>
<div class="r"><div class="lab">2 · Evidenziato</div>
 <div class="p b"><div class="w">Scopri<span class="hl">.AI</span></div></div>
 <div class="p c"><div class="w">Scopri<span class="hl">.AI</span></div></div></div>
<div class="r"><div class="lab">3 · Minuscolo</div>
 <div class="p b"><div class="low">scopri<span class="dot"></span>ai</div></div>
 <div class="p c"><div class="low">scopri<span class="dot"></span>ai</div></div></div>
<div class="r"><div class="lab">4 · Impilato</div>
 <div class="p b"><div class="stack"><div class="s1">SCOPRI</div><div class="s2">AI</div></div></div>
 <div class="p c"><div class="stack"><div class="s1">SCOPRI</div><div class="s2">AI</div></div></div></div>
<div class="r"><div class="lab">5 · Prompt</div>
 <div class="p b"><div class="mono">&gt; scopri.ai<span class="cur"></span></div></div>
 <div class="p c"><div class="mono">&gt; scopri.ai<span class="cur"></span></div></div></div>
<div class="r"><div class="lab">6 · Lente nella parola</div>
 <div class="p b"><div class="w">Sc<svg class="lens" width="92" height="92" viewBox="0 0 1080 1080"><line x1="700" y1="700" x2="900" y2="900" stroke="#FFD84D" stroke-width="150" stroke-linecap="round"/><circle cx="480" cy="480" r="320" fill="none" stroke="#fff" stroke-width="140"/></svg>pri<span class="k">.AI</span></div></div>
 <div class="p c"><div class="w">Sc<svg class="lens" width="92" height="92" viewBox="0 0 1080 1080"><line x1="700" y1="700" x2="900" y2="900" stroke="#2340FF" stroke-width="150" stroke-linecap="round"/><circle cx="480" cy="480" r="320" fill="none" stroke="#121212" stroke-width="140"/></svg>pri<span class="k">.AI</span></div></div></div>
<div class="r"><div class="lab">7 · Fumetto</div>
 <div class="p b"><svg width="140" height="120" viewBox="0 0 700 600"><rect x="0" y="0" width="700" height="460" rx="110" fill="#FFD84D"/><polygon points="120,440 120,600 280,440" fill="#FFD84D"/><text x="350" y="235" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="290" fill="#2340FF">AI</text></svg><div class="w">Scopri</div></div>
 <div class="p c"><svg width="140" height="120" viewBox="0 0 700 600"><rect x="0" y="0" width="700" height="460" rx="110" fill="#2340FF"/><polygon points="120,440 120,600 280,440" fill="#2340FF"/><text x="350" y="235" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="290" fill="#FFFFFF">AI</text></svg><div class="w">Scopri</div></div></div>
</body></html>
