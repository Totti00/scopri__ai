<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scopri AI · 10 prompt per modificare le foto con ChatGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;400;500;600;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="engine/carousel.css">
<style>
/* ===== Scheda del prompt: la chat con la foto allegata ===== */
.pc{position:relative;width:888px;margin-top:48px;padding:34px 40px 32px;z-index:6}
.pc .att{display:flex;align-items:center;gap:16px}
.pc .thumb{width:64px;height:64px;border-radius:14px;background:rgba(var(--accent-rgb),.22);display:grid;place-items:center}
.pc .thumb svg{width:34px;height:34px;fill:none;stroke:var(--accent-300);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc .ui-meta{font-size:22px}
.pc p{margin:24px 0 0;font:400 38px/1.36 var(--font-primary);letter-spacing:-.01em;color:var(--snow);text-wrap:pretty}
.pc .keep{margin-top:22px;padding-top:22px;border-top:2px solid rgba(255,255,255,.1);color:var(--gray-300)}
.pc .keep b{font-weight:600;color:#fff}
.pc .ph{font-weight:500}
.pc .foot{margin-top:22px;display:flex;justify-content:flex-end}
.send{width:60px;height:60px;border-radius:50%;background:var(--accent-500);display:grid;place-items:center}
.send svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.works{left:96px;top:1094px;width:888px;font:500 22px/1 var(--font-meta);letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.works b{color:var(--tp);font-weight:500}
/* ===== Regole ===== */
.tips{position:absolute;left:96px;top:500px;width:888px;z-index:7}
.tip{display:flex;gap:28px;padding:34px 0;border-top:2px solid var(--hair)}
.tip:last-child{border-bottom:2px solid var(--hair)}
.tip>b{flex:none;width:52px;font:500 24px/48px var(--font-meta);color:var(--acc)}
.tip h3{margin:0;font:600 44px/1.12 var(--font-primary);letter-spacing:-.02em;color:var(--tp)}
.tip p{margin:12px 0 0;font:400 31px/1.35 var(--font-primary);color:var(--body);text-wrap:pretty}
/* ===== Chiusura ===== */
.apill .hl{background:#fff;color:var(--accent-700);border-radius:14px;padding:6px 12px;margin:0 2px}
/* ===== Copertine ===== */
.cover-photo{z-index:2;left:0;top:560px;width:1080px;height:790px;border-radius:0;box-shadow:none;background-position:50% 50%}
.cover-fade{position:absolute;left:0;top:560px;width:1080px;height:180px;z-index:3;background:linear-gradient(#0A0A0D,rgba(10,10,13,0))}
.chatwin{left:96px;top:530px;width:888px;padding:28px 32px 26px}
.chatwin .top{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.08)}
.chatwin .top b{font:600 28px/1 var(--font-primary);color:var(--snow)}
.chatwin .dot{width:12px;height:12px;border-radius:50%;background:var(--signal-500)}
.chatwin .me{margin:22px 0 0 auto;width:600px;padding:18px;border-radius:24px;background:rgba(var(--accent-rgb),.28)}
.chatwin .me .shot{height:200px;border-radius:16px;background:url(media/tramonto-telefono.jpg) center/cover}
.chatwin .me p{margin:16px 6px 2px;font:400 30px/1.34 var(--font-primary);color:var(--snow)}
.chatwin .me p b{font-weight:600}
.chatwin .compose{margin-top:22px;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 26px;border-radius:999px;background:rgba(255,255,255,.06)}
.chatwin .compose span{font:400 26px/1 var(--font-primary);color:var(--gray-500)}
.chatwin .compose .send{margin-left:auto;width:52px;height:52px}
.cmp.cv{top:560px}
.cmp.cv .card{min-height:0;padding:34px 32px;gap:16px}
.cmp.cv .c-title{font-size:38px}
.cmp.cv .muted .c-title{text-decoration:line-through;text-decoration-thickness:3px}
.cmp.cv .keep{color:var(--snow);font-weight:600}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="lineglow" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1350">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</svg>

<header class="devbar">
  <h1>Scopri AI · 10 prompt per modificare le foto con ChatGPT<small>1080 × 1350 · npm run export (PNG)</small></h1>
  <button id="btn-grid" aria-pressed="true">Griglia</button>
  <button id="btn-strip" aria-pressed="false">Striscia (giunture)</button>
  <button id="btn-play" hidden>Riproduci animazioni</button>
  <button id="btn-qa">Esegui QA</button>
</header>
<div class="qa" id="qa-out"></div>

<main class="deck" id="deck">
