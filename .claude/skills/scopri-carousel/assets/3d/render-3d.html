<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>3D asset renderer</title>
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Glass & Chrome 3D objects (design-system.md §7.2 family A), rendered procedurally.
// Each asset is rendered twice, over black and over white, and the two frames are
// difference-matted into one PNG whose glass is genuinely see-through.
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const BLUE = '#2340FF', BLUE_300 = '#8595FF';
const q = new URLSearchParams(location.search);
const ASSET = q.get('asset') || 'magnifier';   // a key of OBJECTS below
const SS = +(q.get('ss') || 3);   // supersampling, undone later with a Lanczos downscale

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NoToneMapping;          // keeps compositing linear, so the matte is exact
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* Studio lighting baked into an environment map: big softbox top-left (the system's light
   direction), a vertical strip for the right rim, a low fill and an electric-blue kicker. */
function studio() {
  const s = new THREE.Scene();
  // Gradient dome: light ceiling, mid-grey horizon, dark floor. Chrome is a mirror, so this is what it shows.
  const dome = new THREE.SphereGeometry(20, 64, 32), col = [];
  for (let i = 0; i < dome.attributes.position.count; i++) {
    const y = dome.attributes.position.getY(i) / 20;
    const v = y > 0 ? 0.16 + 0.5 * Math.pow(y, 1.4) : 0.16 * Math.pow(1 + y, 2.2) + 0.012;
    col.push(v, v, v * 1.04);
  }
  dome.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  s.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const panel = (w, h, hex, k, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(9, 6, 0xffffff, 4.0, [-6, 7, 6]);     // key softbox, top-left (the system's light direction)
  panel(1.6, 11, 0xffffff, 2.4, [8, 1, 3]);   // vertical strip, right rim
  panel(12, 2, 0xffffff, 0.9, [0, -7, 5]);    // low fill
  panel(6, 6, BLUE, 2.6, [5, -4, -6]);        // electric-blue kicker behind
  panel(4, 4, 0xffffff, 1.4, [-3, 2, -9]);    // small back highlight
  return s;
}
const env = new THREE.PMREMGenerator(renderer).fromScene(studio(), 0.015).texture;

const chrome = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.07 });
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.02, transmission: 1, thickness: 0.35, ior: 1.5,
  attenuationColor: new THREE.Color(BLUE_300), attenuationDistance: 1.4,
  clearcoat: 1, clearcoatRoughness: 0.02, side: THREE.DoubleSide });
const blueGlass = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(BLUE), roughness: 0.18, transmission: 0.4, thickness: 0.8, ior: 1.45,
  attenuationColor: new THREE.Color(BLUE), attenuationDistance: 0.6, clearcoat: 1, clearcoatRoughness: 0.04 });
const sand = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(BLUE_300), roughness: 0.7, sheen: 0.5, sheenColor: new THREE.Color(0xffffff) });

const scene = new THREE.Scene();
scene.environment = env;
let camera, meta = {};

/* Object library. Each builder adds meshes to the scene and sets the camera and canvas size.
   All objects share the studio and the materials above, so every asset in a carousel looks like one set.
   To add an object: copy a builder, keep the materials, change the geometry, render, check it on all three
   background modes. Use an orthographic, face-on camera when the object must line up with HTML
   (the magnifier's lens sits over a live HTML zoom); otherwise a perspective camera with a slight top-down tilt. */
const OBJECTS = {
  magnifier() {
    // Face-on orthographic view so the lens stays a perfect circle that lines up with the HTML zoom behind it.
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.075, 64, 256), chrome));
    const lens = new THREE.Mesh(new THREE.SphereGeometry(0.97, 128, 64), glass);
    lens.scale.set(1, 1, 0.1); g.add(lens);
    const a = -30 * Math.PI / 180, d = new THREE.Vector3(Math.cos(a), Math.sin(a), 0), rot = a - Math.PI / 2;
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.32, 64), chrome);
    collar.position.copy(d.clone().multiplyScalar(1.04 + 0.16)); collar.rotation.z = rot; g.add(collar);
    const grip = new THREE.Mesh(new THREE.CapsuleGeometry(0.105, 1.15, 16, 64), blueGlass);
    grip.position.copy(d.clone().multiplyScalar(1.04 + 0.32 + 0.105 + 0.575)); grip.rotation.z = rot; g.add(grip);
    scene.add(g);
    const PPU = 150 / 1.075;                         // rim outer radius = 150 px on the slide
    const L = -1.25, R = 2.65, T = 1.25, B = -1.62;
    camera = new THREE.OrthographicCamera(L, R, T, B, 0.1, 50);
    camera.position.set(0, 0, 10);
    renderer.setSize(Math.round((R - L) * PPU * SS), Math.round((T - B) * PPU * SS));
    meta = { ppu: PPU, lensCenter: [-L * PPU, T * PPU], rimInner: (1.0 - 0.075) * PPU, rimOuter: 150 };
  },
  hourglass() {
    // Hourglass: lathe-turned glass bulbs, chrome caps and posts, electric-blue sand.
    const g = new THREE.Group();
    const pts = [[0.50, -1.0], [0.60, -0.84], [0.62, -0.64], [0.53, -0.40], [0.30, -0.18], [0.085, -0.04], [0.065, 0],
                 [0.085, 0.04], [0.30, 0.18], [0.53, 0.40], [0.62, 0.64], [0.60, 0.84], [0.50, 1.0]].map(([x, y]) => new THREE.Vector2(x, y));
    const profile = new THREE.SplineCurve(pts).getPoints(160);
    g.add(new THREE.Mesh(new THREE.LatheGeometry(profile, 160), glass));
    // Caps with a rounded rim, so the edges catch highlights like polished metal
    const e = 0.07, hh = 0.08, capPts = [new THREE.Vector2(0.001, -hh)];
    for (let i = 0; i <= 16; i++) { const t = -Math.PI / 2 + Math.PI * i / 16; capPts.push(new THREE.Vector2(0.8 - e + e * Math.cos(t), (hh - e) * Math.sign(Math.sin(t)) * 0 + e * Math.sin(t) * (hh / e))); }
    capPts.push(new THREE.Vector2(0.001, hh));
    for (const y of [-1.07, 1.07]) {
      const cap = new THREE.Mesh(new THREE.LatheGeometry(capPts, 128), chrome);
      cap.position.y = y; g.add(cap);
    }
    for (const deg of [60, 180, 300]) {
      const t = deg * Math.PI / 180, post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.0, 32), chrome);
      post.position.set(0.72 * Math.cos(t), 0, 0.72 * Math.sin(t)); g.add(post);
    }
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.49, 0.5, 0.1, 96), sand); base.position.y = -0.95; g.add(base);
    const pile = new THREE.Mesh(new THREE.ConeGeometry(0.47, 0.42, 96), sand); pile.position.y = -0.69; g.add(pile);
    const top = new THREE.Mesh(new THREE.ConeGeometry(0.40, 0.34, 96), sand); top.rotation.x = Math.PI; top.position.y = 0.23; g.add(top);
    const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.52, 16), sand); stream.position.y = -0.22; g.add(stream);
    g.rotation.set(0.15, 0.35, -0.17);
    scene.add(g);
    camera = new THREE.PerspectiveCamera(24, 0.74, 0.1, 50);
    camera.position.set(0, 0.3, 8); camera.lookAt(0, 0, 0);
    renderer.setSize(Math.round(560 * SS), Math.round(760 * SS));
  },
  spark() {
    // Claude's "spark" symbol (official path from claude.ai/favicon.svg, colour #D97757), extruded with a rounded
    // bevel in glossy orange ceramic with a clearcoat. It stays orange: it is the subject, the design accent stays blue.
    const D = 'M52.4285 162.873L98.7844 136.879L99.5485 134.602L98.7844 133.334H96.4921L88.7237 132.862L62.2346 132.153L39.3113 131.207L17.0249 130.026L11.4214 128.844L6.2 121.873L6.7094 118.447L11.4214 115.257L18.171 115.847L33.0711 116.911L55.485 118.447L71.6586 119.392L95.728 121.873H99.5485L100.058 120.337L98.7844 119.392L97.7656 118.447L74.5877 102.732L49.4995 86.1905L36.3823 76.62L29.3779 71.7757L25.8121 67.2858L24.2839 57.3608L30.6515 50.2716L39.3113 50.8623L41.4763 51.4531L50.2636 58.1879L68.9842 72.7209L93.4357 90.6804L97.0015 93.6343L98.4374 92.6652L98.6571 91.9801L97.0015 89.2625L83.757 65.2772L69.621 40.8192L63.2534 30.6579L61.5978 24.632C60.9565 22.1032 60.579 20.0111 60.579 17.4246L67.8381 7.49965L71.9133 6.19995L81.7193 7.49965L85.7946 11.0443L91.9074 24.9865L101.714 46.8451L116.996 76.62L121.453 85.4816L123.873 93.6343L124.764 96.1155H126.292V94.6976L127.566 77.9197L129.858 57.3608L132.15 30.8942L132.915 23.4505L136.608 14.4708L143.994 9.62643L149.725 12.344L154.437 19.0788L153.8 23.4505L150.998 41.6463L145.522 70.1215L141.957 89.2625H143.994L146.414 86.7813L156.093 74.0206L172.266 53.698L179.398 45.6635L187.803 36.802L193.152 32.5484H203.34L210.726 43.6549L207.415 55.1159L196.972 68.3492L188.312 79.5739L175.896 96.2095L168.191 109.585L168.882 110.689L170.738 110.53L198.755 104.504L213.91 101.787L231.994 98.7149L240.144 102.496L241.036 106.395L237.852 114.311L218.495 119.037L195.826 123.645L162.07 131.592L161.696 131.893L162.137 132.547L177.36 133.925L183.855 134.279H199.774L229.447 136.524L237.215 141.605L241.8 147.867L241.036 152.711L229.065 158.737L213.019 154.956L175.45 145.977L162.587 142.787H160.805V143.85L171.502 154.366L191.242 172.089L215.82 195.011L217.094 200.682L213.91 205.172L210.599 204.699L188.949 188.394L180.544 181.069L161.696 165.118H160.422V166.772L164.752 173.152L187.803 207.771L188.949 218.405L187.294 221.832L181.308 223.959L174.813 222.777L161.187 203.754L147.305 182.486L136.098 163.345L134.745 164.2L128.075 235.42L125.019 239.082L117.887 241.8L111.902 237.31L108.718 229.984L111.902 215.452L115.722 196.547L118.779 181.541L121.58 162.873L123.291 156.636L123.14 156.219L121.773 156.449L107.699 175.752L86.304 204.699L69.3663 222.777L65.291 224.431L58.2867 220.768L58.9235 214.27L62.8713 208.48L86.304 178.705L100.44 160.155L109.551 149.507L109.462 147.967L108.959 147.924L46.6977 188.512L35.6182 189.93L30.7788 185.44L31.4156 178.115L33.7079 175.752L52.4285 162.873Z';
    const shapes = SVGLoader.createShapes(new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${D}"/></svg>`).paths[0]);
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: 14, bevelEnabled: true, bevelThickness: 6, bevelSize: 3, bevelSegments: 12, curveSegments: 24 });
    geo.center(); geo.rotateX(Math.PI); geo.scale(1 / 100, 1 / 100, 1 / 100);   // rotate, don't mirror: a negative scale flips the faces inside out
    const orange = new THREE.MeshPhysicalMaterial({ color: new THREE.Color('#D97757'), roughness: 0.2, metalness: 0,
      emissive: new THREE.Color('#D97757'), emissiveIntensity: 0.42,   // lifts the face back to the true brand orange
      clearcoat: 1, clearcoatRoughness: 0.05, sheen: 0.3, sheenColor: new THREE.Color('#FFD2BF') });
    const m = new THREE.Mesh(geo, orange);
    m.rotation.set(-0.28, 0.36, 0.04);
    scene.add(m);
    camera = new THREE.PerspectiveCamera(26, 1, 0.1, 50);
    camera.position.set(0, 0, 6.2); camera.lookAt(0, 0, 0);
    renderer.setSize(Math.round(720 * SS), Math.round(720 * SS));
  },
  curve() {
    // Elliptic curve y² = x³ − 3x + 1 (same a = −3 as the NIST curves): a polished chrome tube for the closed oval and
    // the open branch, with electric-blue glass "points" sitting on it. Pure maths, rendered in the house studio.
    const g = new THREE.Group(), f = x => x * x * x - 3 * x + 1, S = 0.62;
    const bis = (lo, hi) => { for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; (f(lo) * f(m) <= 0) ? hi = m : lo = m; } return (lo + hi) / 2; };
    const r1 = bis(-2.5, -1), r2 = bis(0, 1), r3 = bis(1, 2), XMAX = 2.35;
    const arc = (a, b, sign, n) => { const pts = []; for (let i = 0; i <= n; i++) { const t = i / n, x = a + (b - a) * (1 - Math.cos(Math.PI * t)) / 2; pts.push(new THREE.Vector3(x * S, sign * Math.sqrt(Math.max(0, f(x))) * S, 0)); } return pts; };
    const oval = [...arc(r1, r2, 1, 120), ...arc(r2, r1, -1, 120).slice(1)];
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(oval, true), 400, 0.055, 32, true), chrome));
    const branch = [...arc(XMAX, r3, 1, 140), ...arc(r3, XMAX, -1, 140).slice(1)];
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(branch), 400, 0.055, 32, false), chrome));
    for (const end of [branch[0], branch[branch.length - 1]]) { const c = new THREE.Mesh(new THREE.SphereGeometry(0.055, 32, 16), chrome); c.position.copy(end); g.add(c); }
    for (const [x, sg, r] of [[-1.2, 1, 0.16], [0.0, -1, 0.13], [1.85, 1, 0.19], [2.1, -1, 0.12]]) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(r, 64, 32), x === 1.85 ? blueGlass : glass);
      p.position.set(x * S, sg * Math.sqrt(f(x)) * S, 0); g.add(p);
    }
    g.position.x = -0.2 * S; g.rotation.set(-0.25, 0.38, 0.06);
    scene.add(g);
    camera = new THREE.PerspectiveCamera(26, 1.05, 0.1, 50);
    camera.position.set(0, 0, 7.2); camera.lookAt(0, 0, 0);
    renderer.setSize(Math.round(760 * SS), Math.round(724 * SS));
  },
};
if (!OBJECTS[ASSET]) throw new Error(`Unknown asset "${ASSET}". Known: ${Object.keys(OBJECTS).join(', ')}`);
OBJECTS[ASSET]();

const srgbToLin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const linToSrgb = c => Math.round(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055));
const LUT = Float32Array.from({ length: 256 }, (_, i) => srgbToLin(i));

function frame(bgHex) {
  scene.background = new THREE.Color(bgHex);
  renderer.render(scene, camera);
  const c = document.createElement('canvas'); c.width = renderer.domElement.width; c.height = renderer.domElement.height;
  const ctx = c.getContext('2d'); ctx.drawImage(renderer.domElement, 0, 0);
  return ctx.getImageData(0, 0, c.width, c.height);
}

window.renderAsset = () => {
  const black = frame(0x000000), white = frame(0xffffff);
  const out = new ImageData(black.width, black.height), b = black.data, w = white.data, o = out.data;
  for (let i = 0; i < b.length; i += 4) {
    // linear compositing: black = a·C, white = a·C + (1 − a)  →  a = 1 − mean(white − black)
    const lb = [LUT[b[i]], LUT[b[i + 1]], LUT[b[i + 2]]], lw = [LUT[w[i]], LUT[w[i + 1]], LUT[w[i + 2]]];
    const a = Math.min(1, Math.max(0, 1 - ((lw[0] - lb[0]) + (lw[1] - lb[1]) + (lw[2] - lb[2])) / 3));
    if (a < 1 / 255) { o[i + 3] = 0; continue; }
    o[i] = linToSrgb(Math.min(1, lb[0] / a)); o[i + 1] = linToSrgb(Math.min(1, lb[1] / a)); o[i + 2] = linToSrgb(Math.min(1, lb[2] / a));
    o[i + 3] = Math.round(a * 255);
  }
  const c = document.createElement('canvas'); c.width = out.width; c.height = out.height;
  c.getContext('2d').putImageData(out, 0, 0);
  return { png: c.toDataURL('image/png'), ss: SS, meta, gl: renderer.capabilities.isWebGL2 };
};
window.__ready = true;
</script>
